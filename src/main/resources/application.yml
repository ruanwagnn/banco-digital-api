spring:
  application:
    name: banco-digital-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:bancodigital;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

security:
  jwt:
    # Em producao, use uma variavel de ambiente. Esta chave e so para rodar localmente.
    secret: ${JWT_SECRET:troque-esta-chave-secreta-por-uma-bem-grande-e-aleatoria-em-producao-1234567890}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

server:
  port: ${PORT:8080}

logging:
  level:
    br.com.portfolio: INFO
